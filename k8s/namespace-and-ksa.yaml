apiVersion: v1
kind: Namespace
metadata:
  name: payments-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api-ksa
  namespace: payments-prod
  # Note: With modern GKE Workload Identity Federation, we bind IAM roles directly to:
  # principal://iam.googleapis.com/projects/PROJECT_NUM/locations/global/workloadIdentityPools/PROJECT_ID.svc.id.goog/subject/ns/payments-prod/sa/payments-api-ksa
automountServiceAccountToken: false
